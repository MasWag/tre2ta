[package]
name = "tre2ta"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

description = "A Rust library for translating timed regular expressions into timed automata."
readme = "README.md"
repository = "https://github.com/MasWag/tre2ta"
license = "MIT OR Apache-2.0"

keywords = [
  "timed-automata",
  "formal-methods",
  "automata",
  "parsing",
  "verification",
]

categories = [
  "algorithms",
  "parsing",
  "science",
]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
thiserror = "2.0.17"
lalrpop-util = "0.23.1"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = "1.0.145"

[build-dependencies]
lalrpop = "0.23.1"

[dev-dependencies]
proptest = "1.8.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
